<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Optimiseur SQL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #f59e0b;
            --accent: #10b981;
            --dark: #0f172a;
            --gray: #64748b;
            --light-gray: #f1f5f9;
            --white: #ffffff;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-container {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(30px);
            animation: slideUp 0.3s ease forwards;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .modal-title {
            margin-bottom: 0.5rem;
            color: #0f172a;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .modal-subtitle {
            color: #64748b;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            color: #0f172a;
            font-size: 1rem;
        }

        .star-rating-container {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .star-rating {
            font-size: 2rem;
            cursor: pointer;
            color: #e2e8f0;
            transition: color 0.2s ease;
            user-select: none;
        }

        .star-rating:hover {
            color: #f59e0b;
        }

        .star-rating.active {
            color: #f59e0b;
        }

        .form-textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .radio-option:hover {
            background-color: #f8fafc;
        }

        .radio-input {
            margin-right: 0.5rem;
            transform: scale(1.2);
            cursor: pointer;
        }

        .radio-label {
            font-size: 1rem;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #64748b;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
            transform: translateY(-2px);
        }

        .success-message {
            text-align: center;
            padding: 2rem;
            animation: fadeIn 0.5s ease;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .success-title {
            color: #0f172a;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        .success-text {
            color: #64748b;
            margin-bottom: 2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .modal-container {
                padding: 1.5rem;
                border-radius: 15px;
            }

            .modal-title {
                font-size: 1.5rem;
            }

            .star-rating {
                font-size: 1.8rem;
            }

            .button-group {
                flex-direction: column;
                align-items: center;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                max-width: 300px;
            }
        }

        @media (max-width: 480px) {
            .modal-container {
                padding: 1rem;
            }

            .modal-title {
                font-size: 1.3rem;
            }

            .star-rating {
                font-size: 1.5rem;
            }

            .radio-group {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <h2 class="modal-title">💬 Donnez-nous votre avis</h2>
            <p class="modal-subtitle">Vos retours nous aident à améliorer l'outil</p>
        </div>

        <form id="feedbackForm">
            <!-- Question 1: Rating -->
            <div class="form-group">
                <label class="form-label">L'app répond-elle à vos attentes ?</label>
                <div class="star-rating-container">
                    <span class="star-rating" data-rating="1">⭐</span>
                    <span class="star-rating" data-rating="2">⭐</span>
                    <span class="star-rating" data-rating="3">⭐</span>
                    <span class="star-rating" data-rating="4">⭐</span>
                    <span class="star-rating" data-rating="5">⭐</span>
                </div>
                <input type="hidden" name="rating" id="rating" value="">
            </div>

            <!-- Question 2: Ce qui a été aimé -->
            <div class="form-group">
                <label class="form-label">Qu'avez-vous aimé ?</label>
                <textarea name="liked" class="form-textarea" placeholder="Ce qui vous a plu dans l'outil..."></textarea>
            </div>

            <!-- Question 3: Ce qui manque -->
            <div class="form-group">
                <label class="form-label">Qu'est-ce qui manque selon vous ?</label>
                <textarea name="missing" class="form-textarea" placeholder="Les fonctionnalités ou améliorations que vous aimeriez voir..."></textarea>
            </div>

            <!-- Question 4: Ce qui n'a pas été compris -->
            <div class="form-group">
                <label class="form-label">Y a-t-il quelque chose que vous n'avez pas compris ?</label>
                <textarea name="confused" class="form-textarea" placeholder="Les éléments qui vous ont semblé peu clairs..."></textarea>
            </div>

            <!-- Question 5: Recommandation -->
            <div class="form-group">
                <label class="form-label">Recommanderiez-vous l'app ?</label>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="yes" class="radio-input">
                        <span class="radio-label">✅ Oui</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="recommend" value="no" class="radio-input">
                        <span class="radio-label">❌ Non</span>
                    </label>
                </div>
            </div>

            <!-- Question 6: Fonctionnalité à ajouter -->
            <div class="form-group">
                <label class="form-label">Une fonctionnalité à ajouter ?</label>
                <textarea name="feature" class="form-textarea" placeholder="Décrivez la fonctionnalité que vous aimeriez voir..."></textarea>
            </div>

            <!-- Question 7: Remarque libre -->
            <div class="form-group">
                <label class="form-label">Une remarque libre ?</label>
                <textarea name="free_comment" class="form-textarea" placeholder="Tout ce que vous souhaitez nous dire..."></textarea>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="btn-primary">📨 Envoyer</button>
                <button type="button" class="btn-secondary" onclick="closePage()">Annuler</button>
            </div>
        </form>
    </div>

    <script>
        // Gestion des étoiles
        const stars = document.querySelectorAll('.star-rating');
        const ratingInput = document.getElementById('rating');
        
        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                const rating = index + 1;
                ratingInput.value = rating;
                updateStars(rating);
            });
            
            star.addEventListener('mouseenter', () => {
                const rating = index + 1;
                updateStars(rating);
            });
        });
        
        // Reset sur mouseleave du container
        const starsContainer = document.querySelector('.star-rating-container');
        starsContainer.addEventListener('mouseleave', () => {
            const currentRating = parseInt(ratingInput.value) || 0;
            updateStars(currentRating);
        });

        function updateStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }
        
        // Gestion du formulaire
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collecte des données
            const formData = new FormData(this);
            const feedback = {
                rating: formData.get('rating'),
                liked: formData.get('liked'),
                missing: formData.get('missing'),
                confused: formData.get('confused'),
                recommend: formData.get('recommend'),
                feature: formData.get('feature'),
                free_comment: formData.get('free_comment'),
                timestamp: new Date().toISOString()
            };

		fetch("/.netlify/functions/sendFeedback", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(feedback)
})
.then(res => res.json())
.then(data => {
    if (data.success) {
        document.querySelector('.modal-container').innerHTML = `
            <div class="success-message">
                <div class="success-icon">🙏</div>
                <h3 class="success-title">Merci beaucoup !</h3>
                <p class="success-text">Vos retours sont précieux et nous aident à améliorer l'outil.</p>
                <button class="btn-primary" onclick="closePage()">Fermer</button>
            </div>
        `;
        setTimeout(closePage, 5000);
    } else {
        alert("Erreur lors de l'envoi de votre feedback.");
    }
})
.catch(error => {
    console.error("Erreur réseau:", error);
    alert("Impossible d'envoyer le formulaire.");
});

            
            // Animation de succès
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '✅ Merci !';
            submitBtn.style.background = '#10b981';
            
    
        });

        // Fonction pour fermer la page
        function closePage() {
            // Si c'est une popup, on la ferme
            if (window.opener) {
                window.close();
            } else {
                // Sinon on retourne à la page précédente
                window.history.back();
            }
        }

        // Fermeture avec Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePage();
            }
        });

        // Si on vient de la page principale, on peut communiquer avec elle
        window.addEventListener('beforeunload', function() {
            if (window.opener && !window.opener.closed) {
                // Optionnel: notifier la page parente que le modal est fermé
                window.opener.postMessage('feedback-modal-closed', '*');
            }
        });
    </script>
</body>
</html>
